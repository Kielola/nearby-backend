# Render blueprint — commit this, then in Render choose
# "New > Blueprint" and point it at this repo. It fills in the build/start
# commands and health check automatically instead of you typing them.
services:
  - type: web
    name: nearby-backend
    runtime: node
    # NOTE: deliberately NO `rootDir`.
    #
    # This backend is its own repository (Kielola/nearby-backend) with
    # package.json at the root. A Blueprint `rootDir: nearby-backend` would tell
    # Render to look in a subfolder that does not exist and the build would fail
    # immediately. Render's "Root Directory" setting is only for monorepos.
    plan: free
    # Ohio, NOT singapore.
    #
    # Two round trips matter in this app and both are physical distance:
    #   1. Every request does database work, and the Neon database lives in
    #      us-east-2 (Ohio). Render's "ohio" region puts the backend in the same
    #      datacentre as the database, so a query costs a fraction of a
    #      millisecond instead of a ~200 ms Pacific hop.
    #   2. Every realtime message crosses this link too.
    #
    # Singapore was a leftover default. There is no user population there.
    region: ohio
    # No --include=dev and no NODE_ENV here on purpose.
    #
    # Render already sets NODE_ENV=production at RUNTIME for Node services, on
    # its own. Setting it as an env var below ALSO applies it at BUILD time,
    # and npm honours NODE_ENV=production by omitting devDependencies —
    # including @nestjs/cli, which provides the `nest` command. The build then
    # dies with: sh: 1: nest: not found
    #
    # Verified: with NODE_ENV=production the install is 410 packages and `nest`
    # is absent; without it, 886 packages and the build succeeds.
    buildCommand: npm ci && npm run build
    startCommand: node dist/main.js
    healthCheckPath: /health
    envVars:
      # Do NOT add NODE_ENV here — see the comment above. Render injects it at
      # runtime, so the production FRONTEND_URL guard still applies.
      #
      # Render also injects PORT; the app already reads process.env.PORT.
      - key: DATABASE_URL
        sync: false          # paste the Neon connection string, unquoted
      # OPTIONAL. Leave unset and the backend uses an in-memory presence
      # store — fine for a single instance, and it removes a whole service
      # (and signup) from your deployment. Set it to a rediss:// URL before
      # you ever run more than one instance.
      - key: REDIS_URL
        sync: false
      # REQUIRED in production — the server refuses to boot without it.
      # Your Netlify site URL, e.g. https://your-site.netlify.app
      # No trailing slash. A wrong value here fails CORS in the browser.
      - key: FRONTEND_URL
        sync: false
      # The referral programme builds shareable invite links from this origin,
      # and only this origin. It is what makes /?ref=CODE point at the right
      # place. Comma-separate if you serve the app from more than one host.
      - key: REFERRAL_APP_ORIGIN
        value: https://nearby.fashfos.com
      # Comma-separated Firebase UIDs allowed to review payouts, approve
      # influencers and mark referrals fraudulent. EMPTY MEANS NOBODY IS AN
      # ADMIN — the guard fails closed on purpose, so an unset variable can
      # never turn into an open admin API. Set it before you need the review
      # screens.
      - key: ADMIN_FIREBASE_UIDS
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
